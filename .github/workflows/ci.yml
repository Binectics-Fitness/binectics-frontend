name: CI

# Actions minutes are metered on this private repo (GitHub Free: 2,000/month).
# CI runs once per PR commit. It no longer runs again on main after a merge;
# the weekly run below covers main. Draft PRs don't run CI: mark the PR
# "Ready for review" once local checks pass. Use "Run workflow" for an ad-hoc run.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# A newer push to the same PR makes the older run worthless; cancel it.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The old single job ran tsc and next build one after another. They are now
# parallel jobs sharing one dependency cache. Required checks: check, build.
jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        id: node
        with:
          node-version: 22
          package-manager-cache: false
      # node_modules is cached, so a warm job skips `npm ci` (about 40-60 s).
      # npm ci runs only on a miss. Caches saved from a PR are visible to that
      # PR only; the weekly run on main seeds the cache every PR can read.
      - name: Restore dependencies
        id: deps
        uses: actions/cache@v6
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      # tsconfig has "incremental": true, so tsc writes tsconfig.tsbuildinfo even
      # with --noEmit. It hashes file contents, so a stale cache cannot hide an
      # error. Keyed per commit; the restore key takes the newest earlier one.
      - name: Restore tsc build info
        uses: actions/cache@v6
        with:
          path: tsconfig.tsbuildinfo
          key: tsc-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            tsc-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-
      - run: npx tsc --noEmit
      # Tests run on the developer's machine before every push (the pre-push
      # hook), so PR runs skip them to save Actions minutes. The weekly and
      # manual runs on main still run the full suite.
      - run: npm test
        if: github.event_name != 'pull_request'

  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        id: node
        with:
          node-version: 22
          package-manager-cache: false
      # node_modules is cached, so a warm job skips `npm ci` (about 40-60 s).
      # npm ci runs only on a miss. Caches saved from a PR are visible to that
      # PR only; the weekly run on main seeds the cache every PR can read.
      - name: Restore dependencies
        id: deps
        uses: actions/cache@v6
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      # Next's own build cache. Keyed per commit; the restore key takes the
      # newest earlier one, and Next invalidates what changed.
      - name: Restore Next build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npx next build
