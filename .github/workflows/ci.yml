name: CI

# Actions minutes are metered on this private repo (GitHub Free: 2,000/month).
# CI runs once per PR commit. It no longer runs again on main after a merge;
# the weekly run below covers main. Draft PRs don't run CI: mark the PR
# "Ready for review" once local checks pass. Use "Run workflow" for an ad-hoc run.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# A newer push to the same PR makes the older run worthless; cancel it.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # Tests run on the developer's machine before every push (the pre-push
      # hook), so PR runs skip them to save Actions minutes. The weekly and
      # manual runs on main still run the full suite.
      - run: npm test
        if: github.event_name != 'pull_request'
      - run: npx next build
