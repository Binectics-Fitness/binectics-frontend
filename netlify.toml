[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Ignore the API directory during build
[[build.processing]]
  skip_processing = false

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Proxy the backend API through this site's own domain so the httpOnly auth
# cookies are FIRST-party: the browser stores and sends them regardless of
# third-party-cookie policy, and the Next middleware can see access_token.
# Requires NEXT_PUBLIC_API_URL to point at this site (e.g.
# https://binectics.netlify.app/api/v1) instead of the Azure host.
[[redirects]]
  from = "/api/v1/*"
  to = "https://binectics-gym-dev-api-dwbaeufeafgqd6db.canadacentral-01.azurewebsites.net/api/v1/:splat"
  status = 200
  force = true
  # Netlify adds an `x-nf-sign` JWS (HS256, iss "netlify") keyed with the
  # value of the API_SIGNATURE_TOKEN env var (Runtime scope). The API checks
  # it (NETLIFY_PROXY_SIGNATURE_SECRET, same value) before trusting Netlify's
  # report of the browser's IP for rate limiting. Without it every web user
  # shares Netlify's egress IPs in the API's throttles.
  signed = "API_SIGNATURE_TOKEN"
